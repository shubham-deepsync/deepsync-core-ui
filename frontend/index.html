<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSync | Secure Identity</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <div class="auth-container">
        <h1>DeepSync</h1>
        <p class="subtitle">Next-generation enterprise identity management.</p>
        
        <div id="auth-content">
          <button id="login-btn" class="btn btn-primary">Login to Gateway</button>
        </div>
        
        <div id="user-content" style="display: none;">
          <div class="profile-card">
              <div class="profile-row">
                  <span class="profile-label">Name</span>
                  <span id="user-name" class="profile-value"></span>
              </div>
              <div class="profile-row">
                  <span class="profile-label">Email</span>
                  <span id="user-email" class="profile-value"></span>
              </div>
              <div class="profile-row">
                  <span class="profile-label">User ID</span>
                  <span id="user-id" class="profile-value"></span>
              </div>
          </div>
          <div style="margin-top: 2rem;">
            <button id="logout-btn" class="btn btn-secondary">Logout</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
